# Build every supported version on pull requests and pushes.
# The Gradle daemon is Java 25 for every job: configuring the 26.x modules applies
# Loom 1.19, which refuses to resolve on a Java 21 daemon. Every job installs
# both 21 and 25, because the root build configures every module.
# fail-fast cancels the remaining jobs in this matrix when any one of them fails.

name: build
on: [pull_request, push]

jobs:
  check:
    name: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - module: core
            task: :core:test
          - module: fabric-1.21.11
            task: :fabric-1.21.11:build
          - module: fabric-26.1
            task: :versions:fabric-26.1:build
          - module: fabric-26.2
            task: :versions:fabric-26.2:build
          - module: fabric-26.3
            task: :versions:fabric-26.3:build
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Five jobs configure the included 1.21.11 build at once. Maven Central answers
      # that burst with 429, and Gradle does not wait long enough to get through it.
      - name: build
        run: |
          set +e
          log=$(mktemp)
          for attempt in 1 2 3; do
            ./gradlew ${{ matrix.task }} 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -q "Too Many Requests" "$log"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            wait=$((attempt * 30))
            echo "Maven Central returned 429 (attempt ${attempt}). Retrying in ${wait}s."
            sleep "$wait"
          done
      - name: capture build artifacts
        if: matrix.module != 'core'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}
          path: |
            versions/${{ matrix.module }}/build/libs/*.jar
            !versions/${{ matrix.module }}/build/libs/*-sources.jar
