# Manually publish a GitHub Release from the Actions tab.
# Actions → release → Run workflow → enter version (e.g. 0.1.1).
# This bumps mod_version, builds one jar per version module, then creates the v* tag
# and attaches every jar to one GitHub Release. The tag is created by the release
# step, after the jars exist, so a failed build does not leave a tag behind.

name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.1.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push the version bump back to the branch selected in "Run workflow".
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'. Use semver like 0.1.1 or 0.2.0-beta.1" >&2
            exit 1
          fi
          git fetch --tags --force
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: bump mod_version
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if grep -q "^mod_version=${VERSION}$" gradle.properties; then
            echo "mod_version already ${VERSION}"
          else
            sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
            git add gradle.properties
            git commit -m "chore(release): bump mod_version to ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          # 25 runs the Gradle daemon, which Loom 1.19 requires; 21 is the compile
          # toolchain for the 1.21.11 module. Installing both avoids a foojay download.
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # The same 429 burst that fails the matrix build can fail this single buildAll.
      - name: build
        run: |
          set +e
          log=$(mktemp)
          for attempt in 1 2 3; do
            ./gradlew buildAll -Pmod_version=${{ steps.version.outputs.version }} 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -q "Too Many Requests" "$log"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            wait=$((attempt * 30))
            echo "Maven Central returned 429 (attempt ${attempt}). Retrying in ${wait}s."
            sleep "$wait"
          done

      - name: collect mod jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          # One jar per version module. A new directory under versions/ is picked up
          # from its own gradle.properties; this list does not name the modules.
          count=0
          while IFS= read -r -d '' jar; do
            base=$(basename "$jar")
            case "$base" in
              *-sources.jar|*-dev.jar) continue ;;
            esac
            cp "$jar" "release-artifacts/$base"
            count=$((count + 1))
            echo "Selected $base"
          done < <(find versions/*/build/libs -maxdepth 1 -type f -name '*.jar' -print0)
          if [ "$count" -eq 0 ]; then
            echo "No mod JAR found under versions/*/build/libs" >&2
            ls -la versions/*/build/libs || true
            exit 1
          fi
          mod_name=$(sed -n 's/^mod_name=//p' gradle.properties | tr -d ' ')
          missing=0
          for props in versions/*/gradle.properties; do
            mc=$(sed -n 's/^minecraft_version=//p' "$props")
            loader=$(sed -n 's/^loader_name=//p' "$props")
            expected="${mod_name}-${loader}-mc${mc}-v${VERSION}.jar"
            if [ ! -f "release-artifacts/$expected" ]; then
              echo "Missing $expected" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            ls -la release-artifacts versions/*/build/libs || true
            exit 1
          fi
          ls -la release-artifacts

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.bump.outputs.sha }}
          name: Chat Notes ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: release-artifacts/*.jar
