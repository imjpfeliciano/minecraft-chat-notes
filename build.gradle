// Every version module is an included build, so `./gradlew build` at the root would only
// build :core. buildAll is the entry point that produces one jar per supported version.
tasks.register('buildAll') {
	group = 'build'
	description = 'Builds :core and every version module.'

	dependsOn ':core:build'
	dependsOn gradle.includedBuild('fabric-1.21.11').task(':build')
}
