# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Lets Gradle reuse the JDKs actions/setup-java installs instead of downloading its own.
# Missing variables are ignored, so this is a no-op locally.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64

# Fabric Properties
# check these on https://fabricmc.net/develop
# Shared keys (mod_version, mod_name, maven_group, junit_version) come from the
# root gradle.properties via settings.gradle.
# Loader label in the published jar name. A future Forge module sets its own.
loader_name=Fabric
minecraft_version=1.21.11
loader_version=0.18.2
loom_version=1.14-SNAPSHOT
fabric_version=0.139.4+1.21.11
