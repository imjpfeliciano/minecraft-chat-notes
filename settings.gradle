pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Lets Gradle download the JDKs the toolchain blocks ask for (21 here, 25 for the 26.x modules).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
